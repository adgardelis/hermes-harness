name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pinned upstream hermes-agent commit under test (draft PR #89582).
  HERMES_AGENT_COMMIT: 49b044a322b5a87e4f45fb18e73d09d0b204165e

jobs:
  benchmark:
    name: benchmark (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned hermes-agent commit
        # The pinned commit belongs to draft PR #89582. As long as the PR is
        # open (or was merged), prefer the PR ref, which is guaranteed to
        # resolve this exact commit. TODO: once #89582 is merged and the
        # commit is reachable from NousResearch/hermes-agent main, drop the
        # PR-ref fetch and clone the plain upstream branch instead.
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git hermes-agent
          git -C hermes-agent fetch --depth 1 origin refs/pull/89582/head
          git -C hermes-agent checkout "$HERMES_AGENT_COMMIT"
        shell: bash

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip cryptography
        shell: bash

      - name: Run fidelity benchmark (--check)
        run: python benchmarks/run_benchmarks.py --out results/ci --check --module-path "$GITHUB_WORKSPACE/hermes-agent"
        shell: bash

      - uses: actions/upload-artifact@v4
        # Always upload, even when --check fails: the raw results are the
        # primary debugging evidence for a failing matrix leg.
        if: always()
        with:
          name: results-ci-${{ matrix.os }}-py${{ matrix.python }}
          path: results/ci
          if-no-files-found: error

  windows-reparse:
    name: windows reparse-point capability tests
    runs-on: windows-latest
    steps:
      - name: Fetch pinned hermes-agent commit
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git hermes-agent
          git -C hermes-agent fetch --depth 1 origin refs/pull/89582/head
          git -C hermes-agent checkout "$HERMES_AGENT_COMMIT"
        shell: bash

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest cryptography pyyaml
        shell: bash

      # ROADMAP v0.2 requires Windows reparse-point coverage. At commit
      # 49b044a, `git show --stat` confirms tests/tools/test_tool_result_capability.py
      # exists and carries the reparse/symlink/fail-closed suite
      # (test_reparse_metadata_is_rejected_before_open et al.).
      # tests/tools/test_result_spill.py does NOT exist at this commit
      # (verified via git ls-tree), so it is intentionally not listed.
      # KNOWN UPSTREAM BUG at pinned commit 49b044a (found by this repo's
      # benchmark, CI run 34075450968, verified by in-CI diagnostic):
      # resolve_spill_capability opens the ciphertext with os.open()
      # WITHOUT os.O_BINARY, so on Windows the CRT reads it in text mode
      # (CRLF folding / Ctrl+Z truncation) and AEAD verification fails.
      # The failure is CLOSED (availability loss, never wrong bytes); the
      # artifact at rest is intact. 5 tests depend on a successful
      # same-session resolve and therefore cannot pass on Windows until
      # upstream adds O_BINARY. They are deselected from the gate (not
      # deleted: the next step still runs them and reports their status)
      # and tracked in docs/BENCHMARK_REPORT.md. The reparse-point and
      # fail-closed security tests -- the purpose of this job -- still gate.
      - name: Run upstream capability tests (reparse/symlink handling)
        working-directory: hermes-agent
        run: >
          python -m pytest tests/tools/test_tool_result_capability.py -v
          --deselect tests/tools/test_tool_result_capability.py::test_capability_round_trip_is_exact_and_host_path_is_hidden
          --deselect tests/tools/test_tool_result_capability.py::test_read_file_paginates_capability_before_backend_routing
          --deselect tests/tools/test_tool_result_capability.py::test_capability_read_obeys_existing_char_budget
          --deselect tests/tools/test_tool_result_capability.py::test_central_dispatch_spills_direct_transport_result
          --deselect tests/tools/test_tool_result_capability.py::test_handler_forwards_hidden_session_scope
        shell: bash

      # Non-gating visibility for the known upstream Windows bug: these 4
      # tests are expected to FAIL until upstream adds O_BINARY to the
      # resolve-side os.open() (small-payload ones are FLAKY: they fail
      # only when the random ciphertext contains 0x1A or a CRLF pair).
      # If they start passing (e.g. the pinned
      # commit moves to a fixed upstream), remove the deselects above.
      - name: Resolve-dependent tests (expected to fail on Windows; informational)
        working-directory: hermes-agent
        run: >
          python -m pytest tests/tools/test_tool_result_capability.py -v
          -k "round_trip_is_exact or paginates_capability or obeys_existing_char_budget or spills_direct_transport or forwards_hidden_session_scope"
          || true
        shell: bash
