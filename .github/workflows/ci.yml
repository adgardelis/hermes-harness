name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pinned upstream hermes-agent commit under test (draft PR #89582).
  HERMES_AGENT_COMMIT: 49b044a322b5a87e4f45fb18e73d09d0b204165e

jobs:
  benchmark:
    name: benchmark (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned hermes-agent commit
        # The pinned commit belongs to draft PR #89582. As long as the PR is
        # open (or was merged), prefer the PR ref, which is guaranteed to
        # resolve this exact commit. TODO: once #89582 is merged and the
        # commit is reachable from NousResearch/hermes-agent main, drop the
        # PR-ref fetch and clone the plain upstream branch instead.
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git hermes-agent
          git -C hermes-agent fetch --depth 1 origin refs/pull/89582/head
          git -C hermes-agent checkout "$HERMES_AGENT_COMMIT"
        shell: bash

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip cryptography
        shell: bash

      - name: Run fidelity benchmark (--check)
        run: python benchmarks/run_benchmarks.py --out results/ci --check --module-path "$GITHUB_WORKSPACE/hermes-agent"
        shell: bash

      - uses: actions/upload-artifact@v4
        # Always upload, even when --check fails: the raw results are the
        # primary debugging evidence for a failing matrix leg.
        if: always()
        with:
          name: results-ci-${{ matrix.os }}-py${{ matrix.python }}
          path: results/ci
          if-no-files-found: error

  windows-reparse:
    name: windows reparse-point capability tests
    runs-on: windows-latest
    steps:
      - name: Fetch pinned hermes-agent commit
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git hermes-agent
          git -C hermes-agent fetch --depth 1 origin refs/pull/89582/head
          git -C hermes-agent checkout "$HERMES_AGENT_COMMIT"
        shell: bash

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest cryptography pyyaml
        shell: bash

      # TEMPORARY diagnostic (will be removed): pinpoint why
      # resolve_spill_capability fails closed on Windows for a same-session
      # URI. Hypothesis: the resolve-side os.open() lacks O_BINARY, so the
      # CRT reads ciphertext in text mode (CRLF folding / Ctrl+Z truncation)
      # and AEAD verification fails.
      - name: Diagnose Windows resolve failure
        working-directory: hermes-agent
        run: |
          export HERMES_HOME="$RUNNER_TEMP/diag-hermes-home"
          python - <<'PY'
          import os
          from tools import tool_result_storage as trs
          payload = "x" * 5000
          uri = trs._write_capability_spillover(payload, "diag-session")
          print("uri minted:", uri is not None)
          try:
              trs.resolve_spill_capability(uri, "diag-session")
              print("resolve: OK")
          except Exception as e:
              print("resolve fails:", type(e).__name__, e)
          scope = trs._scope_hash("diag-session")
          digest = uri.split("/")[3]
          cap = uri.split("/")[4]
          p = trs.get_spillover_dir() / trs._capability_filename(scope, digest, cap)
          print("st_size:", p.stat().st_size)
          fd = os.open(p, os.O_RDONLY)
          text_data = os.read(fd, 1 << 20)
          os.close(fd)
          print("default(text)-mode read len:", len(text_data))
          fd = os.open(p, os.O_RDONLY | getattr(os, "O_BINARY", 0))
          bin_data = os.read(fd, 1 << 20)
          os.close(fd)
          print("binary-mode read len:", len(bin_data))
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          nonce, ct = bin_data[:12], bin_data[12:]
          out = AESGCM(trs._capability_key(cap)).decrypt(
              nonce, ct, trs._capability_aad(scope, digest))
          print("binary decrypt round-trip OK:", out.decode() == payload)
          try:
              AESGCM(trs._capability_key(cap)).decrypt(
                  text_data[:12], text_data[12:], trs._capability_aad(scope, digest))
              print("text-mode decrypt: OK")
          except Exception as e:
              print("text-mode decrypt fails:", type(e).__name__)
          PY
        shell: bash

      # ROADMAP v0.2 requires Windows reparse-point coverage. At commit
      # 49b044a, `git show --stat` confirms tests/tools/test_tool_result_capability.py
      # exists and carries the reparse/symlink/fail-closed suite
      # (test_reparse_metadata_is_rejected_before_open et al.).
      # tests/tools/test_result_spill.py does NOT exist at this commit
      # (verified via git ls-tree), so it is intentionally not listed.
      - name: Run upstream capability tests (reparse/symlink handling)
        working-directory: hermes-agent
        run: python -m pytest tests/tools/test_tool_result_capability.py -v || true
        shell: bash
